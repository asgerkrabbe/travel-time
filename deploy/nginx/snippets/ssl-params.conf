# Shared TLS parameters, included by every per-app server block in this
# directory (see photoapp.conf / newapp.conf.example). Keeping these in one
# place means adding a new app never means re-typing (or drifting) cipher
# and protocol settings — each site's server block just does:
#
#   include snippets/ssl-params.conf;
#
# and supplies its own ssl_certificate / ssl_certificate_key lines, since
# those are per-domain (certbot manages them under
# /etc/letsencrypt/live/<domain>/).

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS. Safe to share across apps as long as every app on the domain (or its
# subdomains, if this is ever set with `includeSubDomains`) is reachable
# over HTTPS. Left conservative (no includeSubDomains/preload) so it's a
# sane default for a first app; tighten per-domain if desired.
add_header Strict-Transport-Security "max-age=63072000" always;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
