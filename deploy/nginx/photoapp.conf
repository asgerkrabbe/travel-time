# Nginx site config for the photo gallery app (this repository).
#
# Install as a `sites-available` file and symlink into `sites-enabled` so a
# second app can be added later without editing this file or nginx.conf:
#
#   sudo cp deploy/nginx/snippets/ssl-params.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/photoapp.conf /etc/nginx/sites-available/photoapp
#   sudo ln -s /etc/nginx/sites-available/photoapp /etc/nginx/sites-enabled/photoapp
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace photoapp.example.com below with your real domain, then obtain a
# certificate (certbot detects and edits this file's `listen 443`/
# `ssl_certificate` lines in place):
#
#   sudo certbot --nginx -d photoapp.example.com

server {
    listen 80;
    listen [::]:80;
    server_name photoapp.example.com;

    # Redirect HTTP to HTTPS (certbot can also manage this block for you).
    return 301 https://$host$request_uri;
}

server {
    # `http2` as a listen parameter (rather than the separate `http2 on;`
    # directive) works across the widest range of nginx versions, including
    # the 1.18/1.24 packages Ubuntu LTS ships.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photoapp.example.com;

    ssl_certificate     /etc/letsencrypt/live/photoapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoapp.example.com/privkey.pem;
    include snippets/ssl-params.conf;

    # Match MAX_FILE_BYTES in the app's .env (default 10 MB).
    client_max_body_size 10m;

    location /api/upload {
        # Optional: require HTTP Basic auth in addition to the Bearer token.
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 30d;
        add_header         Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
