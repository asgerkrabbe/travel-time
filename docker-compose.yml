version: '3.8'

services:
  photoapp:
    build: .
    image: photoapp:latest
    container_name: photoapp
    # Map the host photos directory into the container so uploads persist
    volumes:
      - /srv/photos:${PHOTO_DIR:-/srv/photos}
      # Bind-mounts the one file served by the /dl/<DOWNLOAD_TOKEN> route
      # (read-only) at a fixed in-container path. DOWNLOAD_FILE_PATH below is
      # intentionally the container-side path, not the host path from .env.
      - /home/asgerkrabbe/files/avatar.zip:/downloads/avatar.zip:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The directory inside the container where photos are stored. This should
      # match the host bind mount above.
      - PHOTO_DIR=${PHOTO_DIR}
      # Set these secrets via an `.env` file or directly in the environment.
      # Replace the token below with a long random secret.
      - UPLOAD_TOKEN=${UPLOAD_TOKEN}
      - PORT=3000
      - MAX_FILE_BYTES=20971520
      # Unguessable-URL download route (see server.js). Unset DOWNLOAD_TOKEN
      # in .env to disable the route entirely.
      - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN}
      - DOWNLOAD_FILE_PATH=/downloads/avatar.zip
